[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qeeg-pipeline"
dynamic = ["version"]
description = "Quantitative EEG feature extraction and visualization pipeline for continuous EEG monitoring research (PedQuEST / POCCA)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Craig Press"},
]

dependencies = [
    # Core data stack
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16.0",
    "duckdb>=1.0",  # parquet fast-path reader (qeeg/ingestion/duckdb_reader.py) — hard runtime dep
    "openpyxl>=3.1",
    "pydantic>=2.7",
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.4",
]

[project.scripts]
qeeg-start = "start:main"

[tool.setuptools.dynamic]
version = {attr = "qeeg.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["qeeg*", "api*"]

[tool.setuptools.package-data]
"*" = ["*.toml", "*.css", "*.md"]
